<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تنوركو — الكاش اليومي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#E35D12; --brand-d:#B8420A; --brand-bg:#FFF1E6;
  --ink:#3A1E0F; --muted:#8A6B58; --line:#F0DCCB; --paper:#FFFBF7;
  --short:#C62828; --short-bg:#FDECEA; --over:#2E7D32; --over-bg:#E8F5E9;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:#FBF4EC;color:var(--ink);font-size:16px;line-height:1.5;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.num,.n{direction:ltr;display:inline-block;font-variant-numeric:tabular-nums}

/* الرأس */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:52px;height:52px;object-fit:contain;border-radius:12px;background:#fff;border:1px solid var(--line)}
.brand .wm{font-family:"Reem Kufi",serif;font-size:1.9rem;font-weight:700;color:var(--brand);line-height:1}
.brand small{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
.month{display:flex;align-items:center;gap:6px}
.month button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:18px;cursor:pointer}
.month strong{min-width:118px;text-align:center;font-weight:500}
.banner{background:#fff4d6;border:1px solid #ecd48a;color:#6b5314;padding:10px 12px;border-radius:8px;font-size:.88rem;margin-bottom:14px}

/* الملخص */
.hero{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;border-radius:16px;padding:18px;margin-bottom:16px}
.hero .lbl{font-size:.88rem;opacity:.9}
.hero .big{font-size:2.3rem;font-weight:700;line-height:1.15;margin:2px 0 4px}
.hero .sub{font-size:.85rem;opacity:.92}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:rgba(255,255,255,.14);border-radius:10px;padding:8px;text-align:center}
.stats span{display:block;font-size:.72rem;opacity:.9}
.stats b{font-size:1rem}

/* البطاقات */
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.panel h2{font-size:1rem;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{font-size:.85rem;color:var(--muted);display:block}
input,textarea{width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);background:#fff}
input[type=number]{direction:ltr;text-align:right}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.live{margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:700;font-size:.95rem}
.live.short{background:var(--short-bg);color:var(--short)}
.live.over{background:var(--over-bg);color:var(--over)}
.live.ok{background:var(--over-bg);color:var(--over)}
.rs{margin-top:12px;border:1.5px solid #f3c3b8;border-radius:12px;overflow:hidden;background:#fff}
.rs h3{margin:0;padding:10px 12px;background:var(--short-bg);color:var(--short);font-size:.95rem;display:flex;justify-content:space-between;align-items:center}
.rr{border-top:1px solid var(--line);padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rr input{margin:0;padding:9px}
.rr .w{grid-column:1/-1;display:flex;gap:6px}
.rr .w input{flex:1}
.rr .x{flex:0 0 36px;width:36px;height:38px;border-radius:8px;border:1px solid #efc4c0;background:#fff;color:var(--short);font-size:18px;cursor:pointer}
.rr .inv{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.rr .inv label{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--ink)}
.rr .inv img{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.radd{display:block;width:100%;border:0;border-top:1px dashed var(--line);background:#fff;padding:11px;font:inherit;font-weight:700;color:var(--brand-d);cursor:pointer}
.rsum{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;border-top:1px solid var(--line)}
.rsum div{padding:8px 4px;font-size:.78rem;color:var(--muted)}
.rsum b{display:block;font-size:1rem;color:var(--ink)}
.rsum .left b{color:var(--short)}.rsum .left.done b{color:var(--over)}
.left-chip{display:block;font-size:.72rem;font-weight:700;margin-top:3px;text-align:center}
.sheet .det{margin-top:16px}
.sheet .det h4{margin:0 0 6px;font-size:15px;color:var(--brand-d)}
.pick{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:8px;padding:12px;color:var(--muted);cursor:pointer;font-size:.9rem;margin-top:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative;width:70px;height:70px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.thumb button{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(58,30,15,.85);color:#fff;font-size:13px;cursor:pointer}
.actions{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:12px;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);flex:0 0 auto;padding:12px 16px}
.btn.del{background:#fff;color:var(--short);border:1px solid #efc4c0;flex:0 0 auto;padding:12px 16px}
.btn.wa{background:#1f8f55}
.btn.dark{background:var(--ink)}

/* السجل */
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.bar h2{margin:0;font-size:1rem}
.toggle{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--ink)}
.toggle input{width:auto;margin:0}
.list{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:#FFF6EE}
.day{text-align:center;background:var(--brand-bg);border-radius:10px;padding:4px 0;color:var(--brand-d)}
.day b{display:block;font-size:1.25rem;line-height:1.1}
.day small{font-size:.68rem}
.info small{display:block;color:var(--muted);font-size:.78rem}
.info .amts{font-size:.84rem}
.chip{font-weight:700;font-size:.85rem;border-radius:20px;padding:4px 10px;white-space:nowrap}
.chip.short{background:var(--short-bg);color:var(--short)}
.chip.over{background:var(--over-bg);color:var(--over)}
.chip.ok{background:#F1F1F1;color:#555}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.foot{display:flex;gap:8px;margin-top:14px}

/* التقرير */
.rep{position:fixed;inset:0;background:#efe6dc;z-index:15;overflow:auto;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.repbar{max-width:760px;margin:0 auto 12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.repbar .actions{margin-top:0;flex-wrap:wrap}
.sheetwrap{overflow-x:auto;padding-bottom:20px}
.sheet{width:760px;margin:0 auto;background:#fff;padding:36px 34px;color:#1d0f07;font-family:"IBM Plex Sans Arabic",Arial,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--brand);padding-bottom:10px;margin-bottom:12px}
.sheet .sh .wm{font-family:"Reem Kufi",serif;font-size:30px;color:var(--brand);font-weight:700}
.sheet .sh img{height:60px}
.sheet .sh .t{text-align:left}
.sheet .sh .t b{display:block;font-size:20px}
.sheet .sh .t span{font-size:13px;color:#7a5a46}
.sheet table{width:100%;border-collapse:collapse;font-size:13px}
.sheet th{background:var(--brand);color:#fff;padding:6px;border:1px solid #d9a07c;font-weight:700}
.sheet td{border:1px solid #ead2c0;padding:5px 7px;text-align:center;height:26px}
.sheet td.l{text-align:right}
.sheet tbody tr:nth-child(even) td{background:#FFF6EE}
.sheet td.s{color:var(--short);font-weight:700}
.sheet td.o{color:var(--over);font-weight:700}
.sheet tr.tot td{background:#FFE0C7!important;font-weight:700;font-size:14px}
.sheet .p{direction:ltr;font-variant-numeric:tabular-nums}
.sheet .box{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 0}
.sheet .box div{border:1px solid #ead2c0;border-radius:8px;padding:8px;text-align:center;font-size:13px}
.sheet .box b{display:block;font-size:17px}
.sheet .sig{display:flex;justify-content:space-between;margin-top:34px;font-size:13px}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:92vw;text-align:center}
.toast.show{opacity:1}
.viewer{position:fixed;inset:0;background:rgba(20,10,5,.9);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.viewer.open{display:flex}
.viewer img{max-width:100%;max-height:100%;border-radius:6px}
.viewer button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;font-size:20px;cursor:pointer}
@media (max-width:480px){.hero .big{font-size:1.9rem}.stats b{font-size:.9rem}}
@media print{
  body.printrep>.wrap,body.printrep .toast,body.printrep .viewer,body.printrep .repbar{display:none!important}
  body.printrep .rep{position:static;padding:0;background:#fff;overflow:visible}
  body.printrep .sheetwrap{overflow:visible;padding:0}
  body.printrep .sheet{width:auto;padding:0;box-shadow:none}
  body.printrep *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:12mm}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="logo.png" alt="شعار تنوركو" onerror="this.remove()">
      <div><div class="wm">تنوركو</div><small>سجل الكاش اليومي</small></div>
    </div>
    <div class="month">
      <button id="next" aria-label="الشهر التالي">›</button>
      <strong id="monthLabel"></strong>
      <button id="prev" aria-label="الشهر السابق">‹</button>
    </div>
  </header>
  <div class="banner" id="demo" hidden>وضع التجربة: البيانات لا تُحفظ بعد إغلاق الصفحة.</div>

  <section class="hero" aria-label="ملخص الشهر">
    <div class="lbl">مجموع النقص هذا الشهر</div>
    <div class="big"><span class="n" id="tShort">0.00</span> <small style="font-size:1rem">درهم</small></div>
    <div class="sub" id="tSub">لا يوجد نقص</div>
    <div class="stats">
      <div><span>كاش النظام</span><b class="n" id="tExp">0.00</b></div>
      <div><span>الكاش الفعلي</span><b class="n" id="tAct">0.00</b></div>
      <div><span>النقص الباقي (بدون سبب)</span><b class="n" id="tLeft">0.00</b></div>
    </div>
  </section>

  <form class="panel" id="f" autocomplete="off">
    <h2 id="formTitle">تسجيل كاش يوم</h2>
    <div class="grid">
      <label class="full">التاريخ<input type="date" id="date" required></label>
      <label>كاش النظام (تقرير الكاشير)<input type="number" id="exp" step="0.01" min="0" inputmode="decimal" required></label>
      <label>الكاش الفعلي (المعدود)<input type="number" id="act" step="0.01" min="0" inputmode="decimal" required></label>
      <label class="full">الكاشير / ملاحظة<textarea id="note" rows="2" placeholder="مثال: الكاشير أحمد — سبب النقص…"></textarea></label>
    </div>
    <div class="live" id="live" hidden></div>
    <div class="rs" id="rsBox">
      <h3><span>النقص والسبب</span><small style="font-weight:500">وين راح المبلغ؟</small></h3>
      <div id="rsRows"></div>
      <button type="button" class="radd" id="rsAdd">+ إضافة سبب (شراء، سلفة، مصروف…)</button>
      <div class="rsum">
        <div>النقص<b class="n" id="rsShort">0.00</b></div>
        <div>المبرر<b class="n" id="rsExpl">0.00</b></div>
        <div class="left" id="rsLeftBox">الباقي<b class="n" id="rsLeft">0.00</b></div>
      </div>
    </div>
    <label class="pick" for="files">📎 إرفاق صورة تقرير الكاشير أو الإيصال</label>
    <input type="file" id="files" accept="image/*" multiple hidden>
    <div class="thumbs" id="thumbs"></div>
    <div class="actions">
      <button class="btn" type="submit" id="saveBtn">حفظ</button>
      <button class="btn del" type="button" id="delBtn" hidden>حذف</button>
      <button class="btn ghost" type="button" id="clearBtn">جديد</button>
    </div>
  </form>

  <div class="bar">
    <h2>الأيام</h2>
    <label class="toggle"><input type="checkbox" id="onlyShort"> أيام النقص فقط</label>
  </div>
  <div class="list" id="rows"></div>

  <div class="foot">
    <button class="btn" id="repBtn" type="button">📄 تقرير الشهر — واتساب / PDF / طباعة</button>
  </div>
</div>

<div class="rep" id="rep" hidden>
  <div class="repbar">
    <div class="actions">
      <button class="btn wa" type="button" id="rImg">إرسال صورة واتساب</button>
      <button class="btn wa" type="button" id="rPdf">إرسال PDF</button>
      <button class="btn dark" type="button" id="rPrint">طباعة</button>
      <button class="btn ghost" type="button" id="rClose">إغلاق</button>
    </div>
    <label class="toggle" style="margin-top:10px"><input type="checkbox" id="rOnlyShort"> أيام النقص فقط في التقرير</label>
  </div>
  <div class="sheetwrap"><div class="sheet" id="sheet"></div></div>
</div>

<div class="toast" id="toast" role="status"></div>
<div class="viewer" id="viewer"><button id="closeV" aria-label="إغلاق">×</button><img id="vImg" alt="صورة"></div>

<script>
const SUPABASE_URL = "https://iekotptltmkjmieauhqc.supabase.co";
const SUPABASE_KEY = "sb_publishable_35u5V1apSr2-DCpjp8ltmg_gIJzhXEN";
const TABLE = "cash_entries";
const BUCKET = "cash-receipts";

const $ = id => document.getElementById(id);
const fmt = n => Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const days = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dmy = s => {const [y,m,d]=s.split("-");return `${+d}/${+m}/${y}`};

let db=null, memory=[], entries=[], editingId=null, photos=[], removed=[], reasons=[];
const now=new Date(); let viewY=now.getFullYear(), viewM=now.getMonth();

let toastT;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),m.length>28?6000:2200)}
const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)});

async function init(){
  try{ await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"); db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }
  catch(e){ $("demo").hidden=false; }
  resetForm(); load();
}

async function load(){
  const from=`${viewY}-${String(viewM+1).padStart(2,"0")}-01`, to=iso(new Date(viewY,viewM+1,0));
  if(db){
    const {data,error}=await db.from(TABLE).select("*").gte("entry_date",from).lte("entry_date",to).order("entry_date",{ascending:false});
    if(error){toast("تعذّر التحميل: "+error.message);return}
    entries=data||[];
  } else entries=memory.filter(e=>e.entry_date>=from&&e.entry_date<=to).sort((a,b)=>b.entry_date.localeCompare(a.entry_date));
  render();
}

const diffOf = e => (+e.actual||0)-(+e.expected||0);
const explOf = e => (e.reasons||[]).reduce((s,r)=>s+(+r.amount||0),0);
const leftOf = e => {const d=diffOf(e); return d<-0.004?Math.max(0,-d-explOf(e)):0};
function chip(d){return d<-0.004?`<span class="chip short">نقص ${fmt(-d)}</span>`:d>0.004?`<span class="chip over">زيادة ${fmt(d)}</span>`:`<span class="chip ok">مطابق</span>`}
function stats(list){
  let te=0,ta=0,sh=0,ov=0,shDays=0,maxS=null;
  list.forEach(e=>{te+= +e.expected||0; ta+= +e.actual||0; const d=diffOf(e);
    if(d<-0.004){sh+=-d;shDays++; if(!maxS||-d>-diffOf(maxS)) maxS=e} else if(d>0.004) ov+=d;});
  const left=list.reduce((s,e)=>s+leftOf(e),0), expl=list.reduce((s,e)=>s+explOf(e),0);
  return {te,ta,sh,ov,shDays,maxS,net:ta-te,left,expl};
}

function render(){
  $("monthLabel").textContent=months[viewM]+" "+viewY;
  const s=stats(entries);
  $("tShort").textContent=fmt(s.sh);
  $("tSub").textContent=entries.length?(s.shDays?`${s.shDays} يوم فيه نقص من ${entries.length} يوم مسجّل`+(s.maxS?` — أكبر نقص ${fmt(-diffOf(s.maxS))} يوم ${dmy(s.maxS.entry_date)}`:""):`${entries.length} يوم مسجّل بدون نقص ✓`):"لا يوجد أيام مسجّلة لهذا الشهر";
  $("tExp").textContent=fmt(s.te); $("tAct").textContent=fmt(s.ta);
  $("tLeft").textContent=fmt(s.left);
  const list=$("onlyShort").checked?entries.filter(e=>diffOf(e)<-0.004):entries;
  $("rows").innerHTML=list.length?list.map(e=>{
    const d=new Date(e.entry_date+"T00:00:00");
    return `<div class="row" data-id="${e.id}" tabindex="0">
      <div class="day"><b>${d.getDate()}</b><small>${months[d.getMonth()]}</small></div>
      <div class="info"><b>${days[d.getDay()]}</b> <small style="display:inline">${dmy(e.entry_date)}</small>
        <div class="amts">النظام <span class="n">${fmt(e.expected)}</span> · الفعلي <span class="n">${fmt(e.actual)}</span></div>
        ${e.note||(e.images||[]).length?`<small>${(e.images||[]).length?`📎${e.images.length} `:""}${esc(e.note||"")}</small>`:""}</div>
      <div>${chip(diffOf(e))}${diffOf(e)<-0.004&&(e.reasons||[]).length?`<span class="left-chip" style="color:${leftOf(e)>0.004?"var(--short)":"var(--over)"}">${leftOf(e)>0.004?"باقي "+fmt(leftOf(e)):"مبرر بالكامل ✓"}</span>`:""}</div>
    </div>`}).join(""):`<div class="empty">${$("onlyShort").checked?"لا يوجد أيام فيها نقص هذا الشهر ✓":"لا يوجد كاش مسجّل لهذا الشهر. سجّل أول يوم من النموذج بالأعلى."}</div>`;
  document.querySelectorAll(".row").forEach(r=>{const o=()=>edit(r.dataset.id);r.onclick=o;r.onkeydown=ev=>{if(ev.key==="Enter")o()}});
}

function drawReasons(){
  $("rsRows").innerHTML=reasons.map((r,i)=>`<div class="rr">
    <div class="w"><input data-i="${i}" data-f="what" value="${esc(r.what)}" placeholder="الأشياء / السبب: شراء خبز، سلفة، توصيل…" aria-label="السبب"><button type="button" class="x" data-x="${i}" aria-label="حذف السبب">×</button></div>
    <input type="number" data-i="${i}" data-f="amount" value="${r.amount??""}" step="0.01" min="0" inputmode="decimal" placeholder="المبلغ" aria-label="المبلغ">
    <input data-i="${i}" data-f="receiver" value="${esc(r.receiver)}" placeholder="اسم المستلم" aria-label="اسم المستلم">
    <div class="inv">${r.img?`<img src="${r.img}" data-v="${i}" alt="فاتورة">`:""}<label>🧾 ${r.img?"تغيير الفاتورة":"إرفاق الفاتورة"}<input type="file" accept="image/*" data-fi="${i}" hidden></label>${r.img?`<button type="button" class="btn ghost" style="padding:6px 10px" data-ri="${i}">إزالة</button>`:""}</div>
  </div>`).join("");
  $("rsRows").querySelectorAll("[data-f]").forEach(el=>el.oninput=()=>{reasons[+el.dataset.i][el.dataset.f]=el.value;updateReasonsSum()});
  $("rsRows").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{const r=reasons.splice(+b.dataset.x,1)[0];if(r&&r.img&&!r.file)removed.push(r.img);drawReasons()});
  $("rsRows").querySelectorAll("[data-fi]").forEach(inp=>inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=reasons[+inp.dataset.fi];if(r.img&&!r.file)removed.push(r.img);r.file=f;r.img=URL.createObjectURL(f);drawReasons()});
  $("rsRows").querySelectorAll("[data-ri]").forEach(b=>b.onclick=()=>{const r=reasons[+b.dataset.ri];if(r.img&&!r.file)removed.push(r.img);r.img="";r.file=null;drawReasons()});
  $("rsRows").querySelectorAll("[data-v]").forEach(im=>im.onclick=()=>{$("vImg").src=im.src;$("viewer").classList.add("open")});
  updateReasonsSum();
}
function updateReasonsSum(){
  const e=parseFloat($("exp").value)||0, a=parseFloat($("act").value)||0, sh=Math.max(0,e-a);
  const ex=reasons.reduce((s,r)=>s+(+r.amount||0),0), left=Math.max(0,sh-ex);
  $("rsShort").textContent=fmt(sh); $("rsExpl").textContent=fmt(ex); $("rsLeft").textContent=fmt(left);
  $("rsLeftBox").classList.toggle("done",sh>0&&left<0.005);
}
$("rsAdd").onclick=()=>{reasons.push({what:"",amount:"",receiver:"",img:""});drawReasons();$("rsRows").lastElementChild.querySelector("input").focus()};

function updateLive(){
  const e=parseFloat($("exp").value), a=parseFloat($("act").value), el=$("live");
  if(isNaN(e)||isNaN(a)){el.hidden=true;updateReasonsSum();return}
  const d=a-e; el.hidden=false;
  el.className="live "+(d<-0.004?"short":d>0.004?"over":"ok");
  el.textContent=d<-0.004?`نقص: ${fmt(-d)} درهم`:d>0.004?`زيادة: ${fmt(d)} درهم`:"مطابق ✓";
  updateReasonsSum();
}
function resetForm(){
  editingId=null; $("f").reset(); $("date").value=iso(new Date()); photos=[]; removed=[]; drawThumbs(); reasons=[]; drawReasons();
  $("formTitle").textContent="تسجيل كاش يوم"; $("saveBtn").textContent="حفظ"; $("delBtn").hidden=true; updateLive();
}
function edit(id){
  const e=entries.find(x=>String(x.id)===String(id)); if(!e) return;
  editingId=e.id; $("date").value=e.entry_date; $("exp").value=e.expected; $("act").value=e.actual; $("note").value=e.note||"";
  photos=(e.images||[]).map(url=>({url})); removed=[]; drawThumbs();
  reasons=(e.reasons||[]).map(r=>({what:r.what||"",amount:r.amount,receiver:r.receiver||"",img:r.img||""})); drawReasons();
  $("formTitle").textContent="تعديل كاش "+dmy(e.entry_date); $("saveBtn").textContent="حفظ التعديل"; $("delBtn").hidden=false;
  updateLive(); $("f").scrollIntoView({behavior:"smooth"});
}

function compress(file){return new Promise(res=>{const img=new Image();img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>res(b||file),"image/jpeg",.8)};img.onerror=()=>res(file);img.src=URL.createObjectURL(file)})}
function drawThumbs(){
  $("thumbs").innerHTML=photos.map((p,i)=>`<div class="thumb"><img src="${p.url}" data-i="${i}" alt="صورة ${i+1}"><button type="button" data-rm="${i}" aria-label="إزالة">×</button></div>`).join("");
  $("thumbs").querySelectorAll("img").forEach(im=>im.onclick=()=>{$("vImg").src=photos[im.dataset.i].url;$("viewer").classList.add("open")});
  $("thumbs").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const p=photos.splice(+b.dataset.rm,1)[0];if(!p.file)removed.push(p.url);drawThumbs()});
}
$("files").onchange=ev=>{for(const file of ev.target.files)photos.push({file,url:URL.createObjectURL(file)});ev.target.value="";drawThumbs()};
$("closeV").onclick=()=>$("viewer").classList.remove("open");
$("viewer").onclick=ev=>{if(ev.target.id==="viewer")$("viewer").classList.remove("open")};

$("f").onsubmit=async ev=>{
  ev.preventDefault();
  const btn=$("saveBtn"); btn.disabled=true; btn.textContent="جاري الحفظ…";
  try{
    const urls=[];
    for(const p of photos){
      if(!p.file){urls.push(p.url);continue}
      if(db){
        const blob=await compress(p.file), path=`cash/${$("date").value}/${Date.now()}-${Math.random().toString(36).slice(2,6)}.jpg`;
        const {error}=await db.storage.from(BUCKET).upload(path,blob,{contentType:"image/jpeg"});
        if(error){toast("تعذّر رفع الصورة: "+error.message);return}
        urls.push(db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl);
      } else urls.push(p.url);
    }
    const rs=[];
    for(const r of reasons){
      if(!String(r.what).trim()&&!(+r.amount)) continue;
      let img=r.img||"";
      if(r.file){
        if(db){
          const blob=await compress(r.file), path=`cash/${$("date").value}/reason-${Date.now()}-${Math.random().toString(36).slice(2,6)}.jpg`;
          const {error}=await db.storage.from(BUCKET).upload(path,blob,{contentType:"image/jpeg"});
          if(error){toast("تعذّر رفع فاتورة السبب: "+error.message);return}
          img=db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
        }
      }
      rs.push({what:String(r.what).trim(),amount:Math.round((+r.amount||0)*100)/100,receiver:String(r.receiver||"").trim(),img});
    }
    if(db&&removed.length){const paths=removed.map(u=>u.split(`/${BUCKET}/`)[1]).filter(Boolean);if(paths.length)await db.storage.from(BUCKET).remove(paths)}
    const rec={entry_date:$("date").value,expected:+$("exp").value,actual:+$("act").value,note:$("note").value.trim(),images:urls,reasons:rs};
    if(db){
      const {error}=editingId?await db.from(TABLE).update(rec).eq("id",editingId):await db.from(TABLE).upsert(rec,{onConflict:"entry_date"});
      if(error){toast("لم يتم الحفظ: "+error.message);return}
    } else {
      const i=memory.findIndex(m=>editingId?m.id===editingId:m.entry_date===rec.entry_date);
      if(i>=0) memory[i]={...memory[i],...rec}; else memory.push({id:Date.now(),...rec});
    }
    const d=rec.actual-rec.expected;
    const lf=d<-0.004?Math.max(0,-d-rs.reduce((s,r)=>s+r.amount,0)):0;
    toast(d<-0.004?(lf>0.004?`تم الحفظ — نقص ${fmt(-d)}، الباقي بدون سبب ${fmt(lf)} درهم`:`تم الحفظ — النقص ${fmt(-d)} مبرر بالكامل ✓`):"تم الحفظ");
    const dt=new Date(rec.entry_date+"T00:00:00"); viewY=dt.getFullYear(); viewM=dt.getMonth();
    resetForm(); load();
  } finally { btn.disabled=false; btn.textContent=editingId?"حفظ التعديل":"حفظ"; }
};
$("delBtn").onclick=async()=>{
  if(!editingId||!confirm("حذف كاش هذا اليوم؟")) return;
  if(db){const {error}=await db.from(TABLE).delete().eq("id",editingId); if(error){toast("لم يتم الحذف: "+error.message);return}}
  else memory=memory.filter(m=>m.id!==editingId);
  toast("تم الحذف"); resetForm(); load();
};
$("clearBtn").onclick=resetForm;
$("exp").oninput=$("act").oninput=updateLive;
$("onlyShort").onchange=render;
$("prev").onclick=()=>{viewM--;if(viewM<0){viewM=11;viewY--}load()};
$("next").onclick=()=>{viewM++;if(viewM>11){viewM=0;viewY++}load()};

/* ---------- التقرير ---------- */
function buildSheet(){
  const only=$("rOnlyShort").checked;
  const list=[...entries].sort((a,b)=>a.entry_date.localeCompare(b.entry_date)).filter(e=>!only||diffOf(e)<-0.004);
  const s=stats(entries), logo=document.querySelector(".brand img");
  const rows=list.map((e,i)=>{const d=new Date(e.entry_date+"T00:00:00"), df=diffOf(e);
    return `<tr><td>${i+1}</td><td>${days[d.getDay()]}</td><td>${dmy(e.entry_date)}</td><td><span class="p">${fmt(e.expected)}</span></td><td><span class="p">${fmt(e.actual)}</span></td>
      <td class="${df<-0.004?"s":df>0.004?"o":""}">${df<-0.004?`نقص <span class="p">${fmt(-df)}</span>`:df>0.004?`زيادة <span class="p">${fmt(df)}</span>`:"مطابق"}</td><td class="${leftOf(e)>0.004?"s":""}">${df<-0.004?`<span class="p">${fmt(leftOf(e))}</span>`:""}</td><td class="l">${esc(e.note||"")}</td></tr>`}).join("");
  const det=list.filter(e=>(e.reasons||[]).length).map(e=>(e.reasons||[]).map((r,j)=>`<tr>${j===0?`<td rowspan="${e.reasons.length}">${dmy(e.entry_date)}</td>`:""}<td class="l">${esc(r.what)}</td><td>${esc(r.receiver)}</td><td><span class="p">${fmt(r.amount)}</span></td><td>${r.img?"🧾 مرفقة":"—"}</td></tr>`).join("")).join("");
  const lt=stats(list);
  $("sheet").innerHTML=`<div class="sh">
      <div>${logo?`<img src="${logo.src}" alt="">`:`<div class="wm">تنوركو</div>`}<div style="font-size:12px;color:#7a5a46">مطعم ومطبخ تنوركو — العين</div></div>
      <div class="t"><b>${only?"تقرير أيام نقص الكاش":"تقرير الكاش اليومي"}</b><span>شهر ${months[viewM]} ${viewY}</span></div>
    </div>
    <table><thead><tr><th style="width:5%">م</th><th style="width:11%">اليوم</th><th style="width:12%">التاريخ</th><th style="width:14%">كاش النظام</th><th style="width:14%">الكاش الفعلي</th><th style="width:15%">النقص / الزيادة</th><th style="width:11%">الباقي</th><th>ملاحظة</th></tr></thead>
    <tbody>${rows||`<tr><td colspan="8">لا توجد أيام</td></tr>`}
      <tr class="tot"><td colspan="3">المجموع (${list.length} يوم)</td><td><span class="p">${fmt(lt.te)}</span></td><td><span class="p">${fmt(lt.ta)}</span></td><td class="${lt.sh?"s":""}">نقص <span class="p">${fmt(lt.sh)}</span></td><td class="${lt.left?"s":""}"><span class="p">${fmt(lt.left)}</span></td><td></td></tr></tbody></table>
    ${det?`<div class="det"><h4>تفاصيل النقص والسبب</h4><table><thead><tr><th style="width:13%">التاريخ</th><th>الأشياء / السبب</th><th style="width:20%">المستلم</th><th style="width:14%">المبلغ</th><th style="width:12%">الفاتورة</th></tr></thead><tbody>${det}</tbody></table></div>`:""}
    <div class="box">
      <div>مجموع النقص<b class="p" style="color:var(--short)">${fmt(s.sh)}</b></div>
      <div>المبرر بأسباب<b class="p">${fmt(s.expl)}</b></div>
      <div>الباقي بدون سبب<b class="p" style="color:var(--short)">${fmt(s.left)}</b></div>
      <div>أيام النقص<b>${s.shDays} من ${entries.length}</b></div>
    </div>
    <div class="sig"><span>توقيع الكاشير: ............</span><span>توقيع المحاسب: ............</span><span>توقيع المدير: ............</span></div>`;
}
const repName=ext=>`تقرير_الكاش_تنوركو_${months[viewM]}_${viewY}${$("rOnlyShort").checked?"_النقص":""}.${ext}`;
async function shareFile(file,title){
  if(navigator.canShare&&navigator.canShare({files:[file]})) await navigator.share({files:[file],title});
  else {const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;a.click();toast("تم تنزيل الملف")}
}
$("repBtn").onclick=()=>{if(!entries.length){toast("لا يوجد أيام مسجّلة لهذا الشهر");return}$("rOnlyShort").checked=false;buildSheet();$("rep").hidden=false;document.body.style.overflow="hidden"};
$("rOnlyShort").onchange=buildSheet;
$("rClose").onclick=()=>{$("rep").hidden=true;document.body.style.overflow=""};
$("rPrint").onclick=()=>{document.body.classList.add("printrep");window.print();setTimeout(()=>document.body.classList.remove("printrep"),1500)};
window.addEventListener("afterprint",()=>document.body.classList.remove("printrep"));
$("rImg").onclick=async()=>{
  const btn=$("rImg"),old=btn.textContent;btn.disabled=true;btn.textContent="جاري تجهيز الصورة…";
  try{
    if(!window.html2canvas) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
    const canvas=await html2canvas($("sheet"),{scale:2,backgroundColor:"#ffffff",useCORS:true});
    const blob=await new Promise(r=>canvas.toBlob(r,"image/jpeg",.92));
    await shareFile(new File([blob],repName("jpg"),{type:"image/jpeg"}),"تقرير الكاش — تنوركو");
  }catch(e){if(e&&e.name!=="AbortError")toast("تعذّر تجهيز الصورة: "+(e.message||e))}
  finally{btn.disabled=false;btn.textContent=old}
};
$("rPdf").onclick=async()=>{
  const btn=$("rPdf"),old=btn.textContent;btn.disabled=true;btn.textContent="جاري تجهيز PDF…";
  try{
    if(!window.html2pdf) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js");
    const blob=await html2pdf().set({margin:6,image:{type:"jpeg",quality:.96},html2canvas:{scale:2,backgroundColor:"#ffffff",useCORS:true},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"],avoid:["tr",".box",".sig"]}}).from($("sheet")).outputPdf("blob");
    await shareFile(new File([blob],repName("pdf"),{type:"application/pdf"}),"تقرير الكاش — تنوركو");
  }catch(e){if(e&&e.name!=="AbortError")toast("تعذّر تجهيز PDF: "+(e.message||e)+" — استخدم الطباعة")}
  finally{btn.disabled=false;btn.textContent=old}
};

init();
</script>
</body>
